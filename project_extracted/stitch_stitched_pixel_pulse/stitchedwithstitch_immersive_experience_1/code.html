<!-- Three.js Implementation -->
<script>
        let scene, camera, renderer, clock;
        let starPixels, shapes = [], noiseWave;
        let mouse = new THREE.Vector2(-10, -10);
        let targetMouse = new THREE.Vector2(-10, -10);
        let lerpSpeed = 0.08; // Increased from 0.05 for more responsive trail

        // Reduce animation speed for accessibility if needed
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            lerpSpeed = 0.01;
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0e0e13); // Deepest purple/black
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('gl-canvas'), 
                antialias: true,
                alpha: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            clock = new THREE.Clock();

            // 1. Pixel Starfield
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 2000;
            const positions = new Float32Array(starCount * 3);
            for(let i=0; i < starCount * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 20;
            }
            starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const starMaterial = new THREE.PointsMaterial({
                size: 0.02,
                color: 0x958da3,
                transparent: true,
                opacity: 0.4,
                sizeAttenuation: true
            });
            starPixels = new THREE.Points(starGeometry, starMaterial);
            scene.add(starPixels);

            // 2. Floating Wireframe Zen Objects
            const icosaGeometry = new THREE.IcosahedronGeometry(0.8, 1);
            const cubeGeometry = new THREE.BoxGeometry(0.6, 0.6, 0.6);
            const wireMaterial = new THREE.MeshBasicMaterial({
                color: 0x7000ff,
                wireframe: true,
                transparent: true,
                opacity: 0.2
            });

            for(let i=0; i<15; i++) {
                const geom = Math.random() > 0.5 ? icosaGeometry : cubeGeometry;
                const shape = new THREE.Mesh(geom, wireMaterial.clone());
                
                shape.position.set(
                    (Math.random() - 0.5) * 12,
                    (Math.random() - 0.5) * 8,
                    (Math.random() - 0.5) * 4
                );
                shape.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                
                shapes.push({
                    mesh: shape,
                    rotationSpeed: (Math.random() - 0.5) * 0.01,
                    floatOffset: Math.random() * Math.PI * 2,
                    baseScale: 0.5 + Math.random() * 0.5,
                    baseColor: new THREE.Color(0x7000ff)
                });
                scene.add(shape);
            }

            // 3. Pseudomorphic Noise Wave (Vibrant Neon Trail)
            const particleCount = 60; // Increased density for more persistent trail
            const waveGeometry = new THREE.BufferGeometry();
            const wavePositions = new Float32Array(particleCount * 3);
            const waveColors = new Float32Array(particleCount * 3);
            
            waveGeometry.setAttribute('position', new THREE.BufferAttribute(wavePositions, 3));
            waveGeometry.setAttribute('color', new THREE.BufferAttribute(waveColors, 3));
            
            const waveMaterial = new THREE.PointsMaterial({
                size: 0.18, // Increased size for more visual impact
                vertexColors: true,
                transparent: true,
                opacity: 0.95, // High opacity for vibrancy
                blending: THREE.AdditiveBlending // Glow effect
            });
            
            noiseWave = new THREE.Points(waveGeometry, waveMaterial);
            scene.add(noiseWave);
            
            // Interaction
            window.addEventListener('mousemove', (e) => {
                targetMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                targetMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            });
            
            // Touch interaction
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    targetMouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                    targetMouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
                }
            }, { passive: true });

            window.addEventListener('resize', onWindowResize);

            // 4. Start Self-Healing interval
            setInterval(healScene, 5000);

            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function healScene() {
            shapes.forEach(s => {
                if (s.mesh.scale.x > 3 || s.mesh.scale.x < 0.1) {
                    s.mesh.scale.setScalar(s.baseScale);
                }
                if (Math.abs(s.mesh.position.x) > 15) s.mesh.position.x *= 0.8;
                if (Math.abs(s.mesh.position.y) > 10) s.mesh.position.y *= 0.8;
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            const delta = clock.getDelta();

            // Smooth interaction
            mouse.x += (targetMouse.x - mouse.x) * lerpSpeed;
            mouse.y += (targetMouse.y - mouse.y) * lerpSpeed;

            starPixels.rotation.y += 0.0005;
            starPixels.rotation.x += 0.0002;

            const raycaster = new THREE.Vector3(mouse.x * 5, mouse.y * 3, 0);
            shapes.forEach((s, i) => {
                s.mesh.rotation.x += s.rotationSpeed;
                s.mesh.rotation.y += s.rotationSpeed;
                s.mesh.position.y += Math.sin(time + s.floatOffset) * 0.002;
                
                const dist = s.mesh.position.distanceTo(raycaster);
                if (dist < 2.5) {
                    const pulse = 1 + Math.sin(time * 5) * 0.2;
                    s.mesh.scale.lerp(new THREE.Vector3().setScalar(s.baseScale * 1.8 * pulse), 0.1);
                    // Brighter reaction color
                    s.mesh.material.color.lerp(new THREE.Color(0x00ffff), 0.1); 
                    s.mesh.material.opacity = 0.8;
                } else {
                    s.mesh.scale.lerp(new THREE.Vector3().setScalar(s.baseScale), 0.05);
                    s.mesh.material.color.lerp(s.baseColor, 0.05);
                    s.mesh.material.opacity = 0.2;
                }
            });

            // Update Neon Noise Wave
            const positions = noiseWave.geometry.attributes.position.array;
            const colors = noiseWave.geometry.attributes.color.array;
            
            // Shift trail positions
            for (let i = particleCount - 1; i > 0; i--) {
                positions[i * 3] = positions[(i - 1) * 3];
                positions[i * 3 + 1] = positions[(i - 1) * 3 + 1];
                positions[i * 3 + 2] = positions[(i - 1) * 3 + 2];
            }
            
            // Lead particle with slightly more frantic noise
            const noiseX = Math.sin(time * 4) * 0.15;
            const noiseY = Math.cos(time * 4) * 0.15;
            positions[0] = mouse.x * 7 + noiseX;
            positions[1] = mouse.y * 4 + noiseY;
            positions[2] = Math.sin(time * 2) * 0.8;

            // Intense Neon Color Shifting
            const trailColor = new THREE.Color();
            for (let i = 0; i < particleCount; i++) {
                const ratio = i / particleCount;
                // Transitioning through Electric Magenta -> Cyan -> Purple
                // Using higher saturation and lightness for neon look
                const hue = (time * 0.2 + (1 - ratio) * 0.3) % 1;
                // Neon palette tends to sit in these ranges
                // We use HSL to ensure maximum saturation and brightness
                trailColor.setHSL(hue, 1.0, 0.6); 
                
                colors[i * 3] = trailColor.r;
                colors[i * 3 + 1] = trailColor.g;
                colors[i * 3 + 2] = trailColor.b;
            }

            noiseWave.geometry.attributes.position.needsUpdate = true;
            noiseWave.geometry.attributes.color.needsUpdate = true;
            
            // Dynamic scale for the trail based on movement speed
            const speed = targetMouse.distanceTo(mouse);
            noiseWave.material.size = 0.15 + speed * 0.5;

            renderer.render(scene, camera);
        }

        init();
    </script>
