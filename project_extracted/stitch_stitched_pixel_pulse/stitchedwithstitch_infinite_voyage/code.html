<!-- Three.js Implementation -->
<script>
        let scene, camera, renderer, clock;
        let starParticles, islands = [];
        let mouse = new THREE.Vector2(0, 0);
        let targetMouse = new THREE.Vector2(0, 0);
        
        // Navigation variables
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraTarget = new THREE.Vector3(0, 0, 0);
        let targetRotation = new THREE.Euler(0, 0, 0);
        let zoomLevel = 5;
        let targetZoom = 5;

        const islandData = [
            { name: "The Origin Core", pos: [0, 0, 0], color: 0xd1bcff, scale: 1.2, type: 'icosahedron' },
            { name: "Code Nebula", pos: [15, 8, -20], color: 0x00eefc, scale: 2.5, type: 'fragment' },
            { name: "Memory Archives", pos: [-25, -12, -35], color: 0xffade1, scale: 3.0, type: 'octahedron' },
            { name: "Synthetics Void", pos: [10, -25, -50], color: 0x7212ff, scale: 4.0, type: 'torus' },
            { name: "Edge of Logic", pos: [-35, 15, -60], color: 0x00dbe9, scale: 2.2, type: 'fragment' }
        ];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x131318);
            scene.fog = new THREE.FogExp2(0x131318, 0.015);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.z = zoomLevel;

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl-canvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            clock = new THREE.Clock();

            // Background Nebula Particles
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 4000;
            const posArray = new Float32Array(starCount * 3);
            for(let i=0; i < starCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 200;
            }
            starGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const starMaterial = new THREE.PointsMaterial({
                size: 0.02,
                color: 0x958da3,
                transparent: true,
                opacity: 0.6,
                sizeAttenuation: true
            });
            starParticles = new THREE.Points(starGeometry, starMaterial);
            scene.add(starParticles);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x3c0090, 0.5);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0x00eefc, 2, 100);
            pointLight.position.set(10, 10, 10);
            scene.add(pointLight);

            // Create Islands
            islandData.forEach((data, index) => {
                const group = new THREE.Group();
                group.position.set(...data.pos);
                
                // Main Core Shape
                let geometry;
                switch(data.type) {
                    case 'icosahedron': geometry = new THREE.IcosahedronGeometry(1, 1); break;
                    case 'octahedron': geometry = new THREE.OctahedronGeometry(1, 0); break;
                    case 'torus': geometry = new THREE.TorusKnotGeometry(0.7, 0.3, 64, 8); break;
                    default: geometry = new THREE.DodecahedronGeometry(1, 0); break;
                }

                const material = new THREE.MeshPhongMaterial({
                    color: data.color,
                    wireframe: true,
                    transparent: true,
                    opacity: 0.7,
                    emissive: data.color,
                    emissiveIntensity: 0.5
                });

                const core = new THREE.Mesh(geometry, material);
                core.scale.setScalar(data.scale);
                group.add(core);

                // Add "Floating Fragments" around the core
                const fragCount = 8 + Math.floor(Math.random() * 8);
                const frags = [];
                for(let i=0; i<fragCount; i++) {
                    const fragGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
                    const fragMat = new THREE.MeshBasicMaterial({ color: data.color, transparent: true, opacity: 0.8 });
                    const frag = new THREE.Mesh(fragGeo, fragMat);
                    
                    const dist = 1.5 * data.scale + Math.random() * 2;
                    const angle1 = Math.random() * Math.PI * 2;
                    const angle2 = Math.random() * Math.PI * 2;
                    
                    frag.position.set(
                        Math.cos(angle1) * Math.cos(angle2) * dist,
                        Math.sin(angle1) * dist,
                        Math.cos(angle1) * Math.sin(angle2) * dist
                    );
                    
                    group.add(frag);
                    frags.push({
                        mesh: frag,
                        orbitSpeed: (Math.random() - 0.5) * 0.02,
                        axis: new THREE.Vector3(Math.random(), Math.random(), Math.random()).normalize(),
                        originalPos: frag.position.clone()
                    });
                }

                // UI Label Element
                const label = document.createElement('div');
                label.className = 'waypoint-label';
                label.textContent = data.name;
                document.getElementById('ui-labels-container').appendChild(label);

                islands.push({
                    group,
                    core,
                    frags,
                    label,
                    data
                });
                scene.add(group);
            });

            setupInteractions();
            animate();
        }

        function setupInteractions() {
            const canvas = document.getElementById('gl-canvas');

            // Mouse Move for subtle parallax
            window.addEventListener('mousemove', (e) => {
                targetMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                targetMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                
                if (isDragging) {
                    const deltaX = e.clientX - previousMousePosition.x;
                    const deltaY = e.clientY - previousMousePosition.y;
                    
                    targetRotation.y += deltaX * 0.005;
                    targetRotation.x += deltaY * 0.005;
                    
                    previousMousePosition = { x: e.clientX, y: e.clientY };
                }
            });

            // Zooming / Voyaging
            window.addEventListener('wheel', (e) => {
                targetZoom += e.deltaY * 0.05;
                // Clamping zoom
                targetZoom = Math.min(Math.max(targetZoom, -100), 100);
            }, { passive: true });

            // Dragging to rotate
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });

            // Reset Camera
            document.getElementById('reset-camera').addEventListener('click', () => {
                targetZoom = 5;
                targetRotation.set(0, 0, 0);
                cameraTarget.set(0, 0, 0);
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Smooth camera transition
            mouse.x += (targetMouse.x - mouse.x) * 0.05;
            mouse.y += (targetMouse.y - mouse.y) * 0.05;

            // Update camera position/rotation based on voyage and drag
            zoomLevel += (targetZoom - zoomLevel) * 0.05;
            camera.position.z = zoomLevel;
            
            // Interaction rotation
            camera.rotation.x += (targetRotation.x - camera.rotation.x) * 0.1;
            camera.rotation.y += (targetRotation.y - camera.rotation.y) * 0.1;

            // Animate Islands
            islands.forEach((island, i) => {
                // Pulse and rotate core
                island.core.rotation.y += 0.005;
                island.core.rotation.z += 0.003;
                const pulse = 1 + Math.sin(time * 2 + i) * 0.05;
                island.core.scale.setScalar(island.data.scale * pulse);
                
                // Animate fragments
                island.frags.forEach(f => {
                    f.mesh.position.applyAxisAngle(f.axis, f.orbitSpeed);
                    f.mesh.rotation.x += 0.02;
                });

                // Update UI Labels position
                const vector = island.group.position.clone();
                vector.project(camera);
                
                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (vector.y * -0.5 + 0.5) * window.innerHeight;
                
                // Only show labels if they are in front of camera
                if (vector.z < 1 && vector.z > -1) {
                    island.label.style.display = 'block';
                    island.label.style.left = `${x}px`;
                    island.label.style.top = `${y - 40}px`;
                    island.label.style.opacity = Math.max(0, 1 - Math.abs(vector.z) * 1.5);
                } else {
                    island.label.style.display = 'none';
                }

                // Proximity interaction
                const distToCamera = camera.position.distanceTo(island.group.position);
                if (distToCamera < 10) {
                    island.core.material.opacity = 0.9;
                    island.core.material.emissiveIntensity = 1.0;
                } else {
                    island.core.material.opacity = 0.5;
                    island.core.material.emissiveIntensity = 0.3;
                }
            });

            // Self-Healing Stars
            starParticles.rotation.y += 0.0005;
            if (time % 15 < 0.1) {
                const positions = starParticles.geometry.attributes.position.array;
                for(let i=0; i<positions.length; i++) {
                    if(Math.abs(positions[i]) > 150) positions[i] *= 0.9;
                }
                starParticles.geometry.attributes.position.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
<!-- Noise Wave Micro-interactions -->
<script>
        const overlay = document.getElementById('noise-overlay');

        window.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.92) {
                createTrail(e.clientX, e.clientY);
            }
        });

        function createTrail(x, y) {
            const trail = document.createElement('div');
            trail.className = 'fixed rounded-full pointer-events-none blur-xl transition-all duration-1000';
            const size = Math.random() * 30 + 15;
            trail.style.width = `${size}px`;
            trail.style.height = `${size}px`;
            trail.style.left = `${x - size/2}px`;
            trail.style.top = `${y - size/2}px`;
            
            const colors = ['#d1bcff', '#00eefc', '#ffade1', '#7212ff'];
            trail.style.background = colors[Math.floor(Math.random() * colors.length)];
            trail.style.opacity = '0.25';
            
            overlay.appendChild(trail);

            setTimeout(() => {
                trail.style.transform = `scale(0.3) translateY(30px)`;
                trail.style.opacity = '0';
                setTimeout(() => trail.remove(), 1000);
            }, 50);
        }

        // Self-healing overflow prevention
        setInterval(() => {
            if (overlay.children.length > 40) {
                while(overlay.firstChild) overlay.removeChild(overlay.firstChild);
            }
        }, 8000);
    </script>
