<!-- Three.js Implementation -->
<script>
        let scene, camera, renderer, clock;
        let particles, shapes = [];
        let mouse = new THREE.Vector2(0, 0);
        let targetMouse = new THREE.Vector2(0, 0);

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x131318);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl-canvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            clock = new THREE.Clock();

            // Background "Pixel Grid" environment
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 1500;
            const posArray = new Float32Array(starCount * 3);
            for(let i=0; i < starCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 15;
            }
            starGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const starMaterial = new THREE.PointsMaterial({
                size: 0.015,
                color: 0x958da3,
                transparent: true,
                opacity: 0.5
            });
            particles = new THREE.Points(starGeometry, starMaterial);
            scene.add(particles);

            // Floating Geometric Shapes (Cyber Nature)
            const geometry = new THREE.IcosahedronGeometry(1, 0); // Low poly for pixel vibe
            const material = new THREE.MeshPhongMaterial({
                color: 0xd1bcff,
                wireframe: true,
                transparent: true,
                opacity: 0.4
            });

            for(let i=0; i<12; i++) {
                const shape = new THREE.Mesh(geometry, material.clone());
                shape.position.set(
                    (Math.random() - 0.5) * 10,
                    (Math.random() - 0.5) * 10,
                    (Math.random() - 0.5) * 5
                );
                shape.rotation.set(Math.random(), Math.random(), Math.random());
                shape.scale.setScalar(Math.random() * 0.5 + 0.2);
                shapes.push({
                    mesh: shape,
                    speed: Math.random() * 0.01,
                    originalPos: shape.position.clone()
                });
                scene.add(shape);
            }

            // Lighting
            const mainLight = new THREE.PointLight(0x00eefc, 2, 20);
            mainLight.position.set(2, 3, 4);
            scene.add(mainLight);

            const ambientLight = new THREE.AmbientLight(0x3c0090, 0.4);
            scene.add(ambientLight);

            animate();
        }

        // Mouse Interactivity
        window.addEventListener('mousemove', (e) => {
            targetMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            targetMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Smooth mouse follow
            mouse.x += (targetMouse.x - mouse.x) * 0.05;
            mouse.y += (targetMouse.y - mouse.y) * 0.05;

            // Rotate camera slightly based on mouse
            camera.position.x += (mouse.x * 0.5 - camera.position.x) * 0.05;
            camera.position.y += (mouse.y * 0.5 - camera.position.y) * 0.05;
            camera.lookAt(0, 0, 0);

            // Animate Shapes
            shapes.forEach((s, i) => {
                s.mesh.rotation.x += 0.005;
                s.mesh.rotation.y += 0.005;
                
                // Sinusoidal "Floating" motion
                s.mesh.position.y = s.originalPos.y + Math.sin(time + i) * 0.2;
                
                // React to mouse proximity
                const dist = s.mesh.position.distanceTo(new THREE.Vector3(mouse.x * 5, mouse.y * 5, 0));
                if (dist < 2) {
                    s.mesh.scale.setScalar(Math.min(0.8, s.mesh.scale.x + 0.02));
                    s.mesh.material.color.setHex(0x00eefc);
                    s.mesh.material.opacity = 0.8;
                } else {
                    s.mesh.scale.setScalar(Math.max(0.3, s.mesh.scale.x - 0.01));
                    s.mesh.material.color.lerp(new THREE.Color(0xd1bcff), 0.05);
                    s.mesh.material.opacity = 0.4;
                }
            });

            // "Self-Healing" Logic: If particles drift too far or get stuck, reset them
            particles.rotation.y += 0.001;
            if (time % 10 < 0.1) {
                // Subtle repair: gently nudge particles back towards center if they wandered
                const positions = particles.geometry.attributes.position.array;
                for(let i=0; i<positions.length; i++) {
                    if(Math.abs(positions[i]) > 10) positions[i] *= 0.95;
                }
                particles.geometry.attributes.position.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
<!-- Noise Wave Micro-interactions (CSS-based trail effect) -->
<script>
        const overlay = document.getElementById('noise-overlay');
        let trails = [];

        window.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.8) {
                createTrail(e.clientX, e.clientY);
            }
        });

        function createTrail(x, y) {
            const trail = document.createElement('div');
            trail.className = 'fixed rounded-full pointer-events-none blur-xl transition-all duration-1000';
            const size = Math.random() * 40 + 20;
            trail.style.width = `${size}px`;
            trail.style.height = `${size}px`;
            trail.style.left = `${x - size/2}px`;
            trail.style.top = `${y - size/2}px`;
            
            const colors = ['#d1bcff', '#00eefc', '#ffade1'];
            trail.style.background = colors[Math.floor(Math.random() * colors.length)];
            trail.style.opacity = '0.3';
            
            overlay.appendChild(trail);

            // Animate out
            setTimeout(() => {
                trail.style.transform = `scale(0.5) translateY(20px)`;
                trail.style.opacity = '0';
                setTimeout(() => trail.remove(), 1000);
            }, 50);
        }

        // Logic check to prevent too many elements
        setInterval(() => {
            if (overlay.children.length > 50) {
                overlay.innerHTML = ''; // Self-healing overflow prevention
            }
        }, 5000);
    </script>
